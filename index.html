<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf5fa">
  <title>Листок — личная канбан-доска</title>
  <style>
    :root {
      color-scheme: light;
      font: 15px/1.45 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: #24252b;
      background: #edf5fa;
      --ink: #24252b;
      --muted: #656873;
      --line: #e7e8eb;
      --focus: #6a54a6;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; min-width: 280px; }
    button, input, textarea { font: inherit; }
    button { color: inherit; cursor: pointer; }
    button:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .workspace {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr);
      align-items: start;
      gap: 12px;
      min-height: 100vh;
      padding: 12px 12px 12px 0;
      background: linear-gradient(110deg, #eaf5fb, #f0f7fb 55%, #f7fafb);
    }
    .sidebar { min-width: 0; padding: 17px 4px 20px 16px; }
    .brand {
      display: flex;
      align-items: center;
      width: max-content;
      margin: 0 0 24px 6px;
    }
    .brand-mark {
      display: grid;
      place-content: center;
      grid-auto-flow: column;
      align-items: start;
      gap: 2px;
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: #112653;
    }
    .brand-mark i { width: 3px; border-radius: 2px; background: #f6f1ff; height: 10px; }
    .brand-mark i:nth-child(2) { background: #dfcdf8; height: 14px; }
    .brand-mark i:nth-child(3) { background: #bce3d3; height: 8px; }

    .sidebar-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 5px 8px 8px;
    }
    .sidebar-heading h2 {
      margin: 0;
      color: #536371;
      font-size: 13px;
      font-weight: 650;
    }
    .new-board {
      min-height: 30px;
      padding: 3px 9px;
      color: #283e52;
      background: #ffffffa6;
      border: 1px solid #d5e2ea;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 650;
    }
    .new-board:hover { background: #fff; border-color: #bacdd9; }
    .board-list {
      display: grid;
      gap: 3px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .board-link {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 35px;
      padding: 6px 9px;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: #344654;
      text-align: left;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    .board-link::before {
      content: "";
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #8496a3;
    }
    .board-link:hover { background: #ffffff99; }
    .board-link[aria-current] {
      color: #1c2a39;
      background: #fff;
      border-color: #dce7ee;
      box-shadow: 0 1px 3px #162c4210;
      font-weight: 650;
    }
    .board-link[aria-current]::before { background: #233750; }

    .board-frame {
      min-width: 0;
      min-height: calc(100vh - 24px);
      padding: 22px;
      background: #fff;
      border: 1px solid #e8eff3;
      border-radius: 16px;
      box-shadow: 0 3px 10px rgb(23 43 62 / 16%);
    }
    .page-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px 16px; }
    .board-name { display: flex; align-items: center; gap: 6px; min-width: 0; }
    h1 {
      margin: 0;
      overflow-wrap: anywhere;
      font-size: clamp(23px, 3vw, 32px);
      line-height: 1.2;
      letter-spacing: -.045em;
      font-weight: 700;
    }
    .rename-board {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #546372;
      opacity: 0;
    }
    .board-name:hover .rename-board, .board-name:focus-within .rename-board { opacity: 1; }
    .rename-board:hover { background: #edf3f7; }
    .pencil {
      position: relative;
      display: block;
      width: 14px;
      height: 5px;
      border: 1.3px solid currentColor;
      border-radius: 0 2px 2px 0;
      transform: rotate(-45deg);
    }
    .pencil::before {
      content: "";
      position: absolute;
      top: -1px;
      left: -4px;
      width: 0;
      height: 0;
      border: 2px solid transparent;
      border-right: 3px solid currentColor;
      border-left: 0;
    }
    .rename-form { display: flex; flex: 1; flex-wrap: wrap; align-items: center; gap: 7px; min-width: 0; }
    .rename-form input {
      flex: 1 1 150px;
      min-width: 0;
      padding: 7px 9px;
      border: 1px solid #cfdce6;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      font-weight: 650;
    }
    .rename-form button { min-height: 34px; padding: 6px 9px; }
    .page-heading > .primary { flex: 0 0 auto; }
    @media (hover: none) { .rename-board { opacity: 1; } }
    .primary, .secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 650;
    }
    .primary { color: #fff; background: #292831; }
    .primary:hover { background: #45424e; }
    .primary:disabled { opacity: .48; cursor: default; }
    .secondary { background: transparent; color: #565663; }
    .secondary:hover { background: #f0eef2; }
    .plus { display: inline-block; flex: 0 0 auto; position: relative; width: 16px; height: 16px; }
    .plus::before, .plus::after {
      content: "";
      position: absolute;
      inset: 7px 2px;
      border-radius: 1px;
      background: currentColor;
    }
    .plus::after { transform: rotate(90deg); }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-top: 20px;
    }
    .lane {
      --accent: #7956ae;
      --dot: #ad8bd9;
      --tint: #f5effb;
      --edge: #dbc9ee;
      --wash: #f8f6fa;
      --lane-line: #f0edf3;
      min-width: 0;
      min-height: clamp(365px, calc(100vh - 140px), 900px);
      padding: 13px;
      border: 1px solid var(--lane-line);
      border-radius: 14px;
      background: var(--wash);
      transition: border-color .15s, background-color .15s;
    }
    .lane[data-status="doing"] {
      --accent: #876319;
      --dot: #e0ad4a;
      --tint: #fdf4dd;
      --edge: #e9d39f;
      --wash: #faf8f3;
      --lane-line: #f2efe7;
    }
    .lane[data-status="done"] {
      --accent: #386e58;
      --dot: #73b495;
      --tint: #e7f4ed;
      --edge: #b9daca;
      --wash: #f4f8f6;
      --lane-line: #ecf2ee;
    }
    .lane.is-over { border-color: var(--dot); background: var(--tint); }
    .lane-head { display: flex; align-items: center; gap: 9px; min-height: 34px; margin: 0 3px 12px; }
    .lane-dot { width: 5px; height: 18px; border-radius: 4px; background: var(--dot); }
    .lane h2 { font-size: 15px; font-weight: 680; margin: 0; letter-spacing: -.017em; }
    .count {
      display: grid;
      place-items: center;
      min-width: 23px;
      height: 22px;
      padding: 0 5px;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      background: var(--tint);
      border-radius: 7px;
    }
    .cards { display: grid; gap: 9px; }
    .card, .editor {
      position: relative;
      min-width: 0;
      border: 1px solid #e9e7ec;
      border-radius: 11px;
      background: #fff;
      box-shadow: 0 2px 3px #302b3e08;
    }
    .card:hover, .card:focus-within { border-color: var(--edge); }
    .card.is-dragging { opacity: .36; }
    .card.is-before::before, .card.is-after::after {
      content: "";
      position: absolute;
      inset: -5px 0 auto;
      height: 2px;
      background: var(--accent);
      pointer-events: none;
    }
    .card.is-after::after { inset: auto 0 -5px; }
    .card-grip {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 25px;
      border-radius: 10px 0 0 10px;
      cursor: grab;
      touch-action: none;
    }
    .card-grip::before {
      content: "";
      position: absolute;
      top: 16px;
      left: 8px;
      width: 8px;
      height: 12px;
      opacity: .7;
      background: radial-gradient(circle, #777380 1px, transparent 1.5px) 0 0 / 4px 4px;
      pointer-events: none;
    }
    .drag-preview {
      position: fixed;
      z-index: 4;
      padding: 11px 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 14px;
      font-weight: 650;
      pointer-events: none;
      box-shadow: 0 8px 20px #26233326;
    }
    @media (pointer: coarse) {
      .card-grip { display: none; }
    }
    .card-text {
      display: block;
      width: 100%;
      min-height: 55px;
      margin: 0;
      padding: 13px 41px 13px 25px;
      overflow-wrap: anywhere;
      text-align: left;
      border: 0;
      border-radius: 10px;
      background: transparent;
    }
    .card-title { display: block; font-size: 14px; font-weight: 650; }
    @media (pointer: coarse) { .card-text { padding-left: 13px; } }
    .card-description { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; white-space: pre-wrap; }
    .card-actions { position: absolute; top: 10px; right: 8px; }
    .card-actions[open] { z-index: 2; }
    .card-actions summary {
      display: grid;
      place-items: center;
      list-style: none;
      width: 29px;
      height: 29px;
      border-radius: 7px;
      cursor: pointer;
      color: #6a6774;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
    }
    .card-actions summary::-webkit-details-marker { display: none; }
    .card-actions summary:hover, .card-actions[open] summary { background: var(--tint); color: var(--ink); }
    .action-list {
      position: absolute;
      min-width: max-content;
      right: 0;
      top: 33px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      box-shadow: 0 6px 20px #2623331c;
    }
    .action-list button {
      display: block;
      width: 100%;
      padding: 7px 9px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      text-align: left;
      font-size: 13px;
    }
    .action-list button:hover { background: #f2f1f4; }
    .action-list .delete { color: #a33b48; }

    .add-card {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      min-height: 39px;
      margin-top: 10px;
      padding: 8px;
      border: 1px dashed transparent;
      border-radius: 11px;
      background: transparent;
      color: var(--accent);
      font-size: 13px;
      font-weight: 640;
    }
    .add-card:hover { border-color: var(--edge); background: var(--tint); }
    .cards:empty + .add-card {
      flex-direction: column;
      gap: 8px;
      min-height: 101px;
      margin-top: 0;
      border-color: var(--edge);
      background: var(--tint);
    }
    .cards:empty + .add-card:hover { border-color: var(--accent); }
    .cards:empty + .add-card .plus {
      width: 27px;
      height: 27px;
      border-radius: 8px;
      background: #ffffffa6;
    }
    .cards:empty + .add-card .plus::before, .cards:empty + .add-card .plus::after { inset: 13px 8px; }

    .editor { padding: 10px; border-color: var(--dot); }
    .editor input, .editor textarea {
      display: block;
      width: 100%;
      padding: 8px 9px;
      border: 1px solid #e8e6eb;
      border-radius: 7px;
      color: var(--ink);
      background: #fff;
    }
    .editor input { font-weight: 650; }
    .editor textarea { margin-top: 7px; min-height: 66px; resize: vertical; font-size: 13px; }
    .editor input::placeholder, .editor textarea::placeholder { color: #73717d; }
    .editor-buttons { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .editor-buttons button { min-height: 32px; padding: 5px 9px; }
    .storage-error { margin: 12px 0 0; color: #9c3543; font-size: 13px; }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    [hidden] { display: none !important; }

    @media (max-width: 940px) {
      .workspace { grid-template-columns: 178px minmax(0, 1fr); gap: 8px; }
      .sidebar { padding-left: 10px; }
      .board-frame { padding: 15px; }
      .board { gap: 7px; }
      .lane { padding: 8px; }
    }
    @media (max-width: 695px) {
      .workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr; gap: 9px; padding: 10px; }
      .sidebar { padding: 2px 1px; }
      .brand { display: none; }
      .sidebar-heading { margin: 0 1px 6px 3px; }
      .board-list { display: flex; gap: 5px; overflow-x: auto; padding: 4px; }
      .board-list li { flex: 0 0 auto; max-width: 75%; }
      .board-link { min-height: 32px; }
      .board-frame { min-height: 0; padding: 12px; }
      .page-heading { flex-wrap: wrap; }
      .board { grid-template-columns: minmax(0, 1fr); margin-top: 14px; gap: 9px; }
      .lane { min-height: 0; padding: 10px; border-radius: 11px; }
      .lane-head { min-height: 28px; margin-bottom: 7px; }
      .cards:empty + .add-card { flex-direction: row; min-height: 56px; }
    }
    @media (max-width: 350px) {
      h1 { font-size: 21px; }
      .page-heading > .primary { padding-inline: 8px; gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { .lane { transition: none; } }
  </style>
</head>
<body>
  <div class="workspace">
    <aside class="sidebar" aria-labelledby="boards-heading">
      <div class="brand" role="img" aria-label="Листок">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      </div>
      <div class="sidebar-heading">
        <h2 id="boards-heading">Доски</h2>
        <button class="new-board" id="new-board" type="button" aria-label="New — новая доска">New</button>
      </div>
      <ul class="board-list" id="board-list"></ul>
    </aside>
    <main class="board-frame">
      <div class="page-heading">
        <div class="board-name" id="board-name">
          <h1 id="board-title">Мои задачи</h1>
          <button class="rename-board" id="rename-board" type="button" aria-label="Переименовать доску">
            <span class="pencil" aria-hidden="true"></span>
          </button>
        </div>
        <form class="rename-form" id="rename-form" hidden>
          <input id="rename-input" aria-label="Название доски" maxlength="80" required>
          <button class="primary" type="submit">Сохранить</button>
          <button class="secondary" id="cancel-rename" type="button">Отмена</button>
        </form>
        <button class="primary" id="new-task" type="button"><span class="plus" aria-hidden="true"></span>Новая задача</button>
      </div>
      <p class="storage-error" id="storage-error" role="alert" hidden>Браузер не смог сохранить изменения. Они доступны, пока открыта эта вкладка.</p>
      <div class="board" id="board" role="region" aria-label="Канбан-доска"></div>
    </main>
    <div class="sr-only" aria-live="polite" id="announcement"></div>
  </div>
  <script>
    "use strict";

    const statuses = [
      { id: "todo", title: "К выполнению", destination: "Вернуть к выполнению" },
      { id: "doing", title: "В работе", destination: "Переместить в работу" },
      { id: "done", title: "Готово", destination: "Отметить готовой" }
    ];
    const storageKey = "listok-kanban-v1";
    const boardsKey = "listok-kanban-boards-v1";
    const selectionKey = "listok-kanban-selected-board";
    const firstBoard = { id: "main", title: "Мои задачи" };
    const board = document.querySelector("#board");
    const boardList = document.querySelector("#board-list");
    const boardName = document.querySelector("#board-name");
    const boardTitle = document.querySelector("#board-title");
    const renameButton = document.querySelector("#rename-board");
    const renameForm = document.querySelector("#rename-form");
    const renameInput = document.querySelector("#rename-input");
    const announcement = document.querySelector("#announcement");
    const storageError = document.querySelector("#storage-error");
    const lanes = new Map();
    const draftTasks = new Map();
    const unsaved = new Map();
    let boards = [firstBoard];
    let activeBoardId = firstBoard.id;
    let tasks = [];
    let editor = null;
    let drag = null;

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      if (tag === "button") node.type = "button";
      return node;
    }

    function parseTasks(value) {
      const data = JSON.parse(value ?? "[]");
      if (!Array.isArray(data)) throw new Error("Invalid board data");
      const ids = new Set();
      return data.filter(task => {
        if (!task || typeof task.id !== "string" || ids.has(task.id) ||
            typeof task.title !== "string" || typeof task.description !== "string" ||
            !lanes.has(task.status)) return false;
        ids.add(task.id);
        return true;
      });
    }

    function parseBoards(value) {
      const data = JSON.parse(value ?? "[]");
      if (!Array.isArray(data)) throw new Error("Invalid board list");
      const names = new Map();
      for (const item of data) {
        if (typeof item?.id === "string" && item.id && typeof item.title === "string" && item.title.trim()) {
          names.set(item.id, item.title);
        }
      }
      const mainTitle = names.get(firstBoard.id) ?? firstBoard.title;
      names.delete(firstBoard.id);
      return [{ ...firstBoard, title: mainTitle }, ...Array.from(names, ([id, title]) => ({ id, title }))];
    }

    function createId() {
      return globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function taskKey(id) {
      return id === firstBoard.id ? storageKey : `${storageKey}:${id}`;
    }

    function readStorage(key) {
      return unsaved.get(key) ?? localStorage.getItem(key);
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, value);
        unsaved.delete(key);
      } catch {
        unsaved.set(key, value);
      }
      storageError.hidden = unsaved.size === 0;
    }

    function save() {
      writeStorage(taskKey(activeBoardId), JSON.stringify(tasks));
    }

    function updateBoards(change) {
      try {
        const latest = parseBoards(readStorage(boardsKey));
        if (!latest.some(item => item.id === activeBoardId)) {
          latest.push(boards.find(item => item.id === activeBoardId));
        }
        boards = latest;
      } catch {
        storageError.hidden = false;
      }
      boards = change(boards);
      writeStorage(boardsKey, JSON.stringify(boards));
    }

    function loadTasks() {
      tasks = [];
      try {
        tasks = parseTasks(readStorage(taskKey(activeBoardId)));
      } catch {
        storageError.hidden = false;
      }
    }

    function renderBoardList() {
      const current = boards.find(item => item.id === activeBoardId);
      boardTitle.textContent = current.title;
      const items = boards.map(item => {
        const row = element("li");
        const button = element("button", "board-link", item.title);
        if (item.id === activeBoardId) button.setAttribute("aria-current", "true");
        button.addEventListener("click", () => {
          if (item.id === activeBoardId) return;
          selectBoard(item.id);
          boardList.querySelector("[aria-current]")?.focus({ preventScroll: true });
        });
        row.append(button);
        return row;
      });
      boardList.replaceChildren(...items);
    }

    function showRenameForm() {
      renameInput.value = boardTitle.textContent;
      renameInput.setCustomValidity("");
      boardName.hidden = true;
      renameForm.hidden = false;
      renameInput.focus();
      renameInput.select();
    }

    function hideRenameForm() {
      renameForm.hidden = true;
      boardName.hidden = false;
    }

    function reconcileDraft() {
      if (!editor?.id) return;
      const saved = tasks.find(task => task.id === editor.id);
      if (saved) editor.status = saved.status;
      else editor.id = null;
    }

    function selectBoard(id) {
      if (drag) endDrag();
      if (editor) draftTasks.set(activeBoardId, editor);
      else draftTasks.delete(activeBoardId);
      activeBoardId = id;
      writeStorage(selectionKey, id);
      loadTasks();
      editor = draftTasks.get(id) ?? null;
      reconcileDraft();
      hideRenameForm();
      renderBoardList();
      render();
    }

    function focusTask(id) {
      board.querySelector(`[data-task="${CSS.escape(id)}"] .card-text`)?.focus();
    }

    function moveTask(id, status, target = null, after = false) {
      const task = tasks.find(item => item.id === id);
      if (!task || target === id) return;
      tasks = tasks.filter(item => item.id !== id);
      const index = target ? tasks.findIndex(item => item.id === target && item.status === status) : -1;
      const moved = { ...task, status };
      if (index < 0) tasks.push(moved);
      else tasks.splice(index + Number(after), 0, moved);
      save();
      render();
      focusTask(id);
      announcement.textContent = `Задача «${task.title}» перемещена в колонку «${lanes.get(status).title}».`;
    }

    function makeCard(task) {
      const card = element("article", "card");
      card.dataset.task = task.id;
      const grip = element("span", "card-grip");
      grip.setAttribute("aria-hidden", "true");

      const text = element("button", "card-text");
      text.setAttribute("aria-label", `Редактировать задачу «${task.title}»`);
      text.append(element("span", "card-title", task.title));
      if (task.description) {
        const description = element("span", "card-description", task.description);
        description.id = `description-${task.id}`;
        text.setAttribute("aria-describedby", description.id);
        text.append(description);
      }
      text.addEventListener("click", () => openEditor(task.status, task.id));

      const actions = element("details", "card-actions");
      const trigger = element("summary", "", "⋯");
      trigger.setAttribute("aria-label", `Действия с задачей «${task.title}»`);
      trigger.addEventListener("click", () => closeActions(actions));
      const menu = element("div", "action-list");

      for (const status of statuses) {
        if (status.id === task.status) continue;
        const move = element("button", "", status.destination);
        move.addEventListener("click", () => moveTask(task.id, status.id));
        menu.append(move);
      }

      const remove = element("button", "delete", "Удалить задачу");
      remove.addEventListener("click", () => {
        if (!window.confirm(`Удалить задачу «${task.title}»?`)) return;
        if (editor?.id === task.id) editor = null;
        tasks = tasks.filter(item => item.id !== task.id);
        save();
        render();
        lanes.get(task.status).add.focus();
        announcement.textContent = "Задача удалена.";
      });
      menu.append(remove);
      actions.append(trigger, menu);
      card.append(text, grip, actions);
      return card;
    }

    function openEditor(status, id = null) {
      if (editor) {
        board.querySelector(".editor input")?.focus();
        return;
      }
      const task = tasks.find(item => item.id === id);
      editor = { id, status, title: task?.title ?? "", description: task?.description ?? "" };
      closeActions();
      render();
      board.querySelector(".editor input")?.focus();
    }

    function closeEditor() {
      const { id, status } = editor;
      editor = null;
      render();
      if (id && tasks.some(task => task.id === id)) focusTask(id);
      else lanes.get(status).add.focus();
    }

    function makeEditor() {
      const form = element("form", "editor");
      const title = element("input");
      title.type = "text";
      title.required = true;
      title.maxLength = 180;
      title.placeholder = "Название задачи";
      title.setAttribute("aria-label", title.placeholder);
      title.value = editor.title;

      const description = element("textarea");
      description.rows = 2;
      description.placeholder = "Описание (необязательно)";
      description.setAttribute("aria-label", description.placeholder);
      description.value = editor.description;

      const controls = element("div", "editor-buttons");
      const confirm = element("button", "primary", editor.id ? "Сохранить" : "Добавить");
      confirm.type = "submit";
      confirm.disabled = !title.value.trim();
      const cancel = element("button", "secondary", "Отмена");
      cancel.addEventListener("click", closeEditor);
      controls.append(confirm, cancel);
      form.append(title, description, controls);

      title.addEventListener("input", () => {
        editor.title = title.value;
        confirm.disabled = !title.value.trim();
      });
      description.addEventListener("input", () => { editor.description = description.value; });
      form.addEventListener("submit", event => {
        event.preventDefault();
        const name = title.value.trim();
        if (!name) return;
        const current = tasks.find(task => task.id === editor.id);
        const id = current?.id ?? createId();
        const task = { id, status: current?.status ?? editor.status, title: name, description: description.value.trim() };
        if (current) tasks = tasks.map(item => item.id === id ? task : item);
        else tasks.push(task);
        editor = null;
        save();
        render();
        focusTask(id);
        announcement.textContent = current ? "Задача сохранена." : "Задача добавлена.";
      });
      form.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          event.preventDefault();
          closeEditor();
        }
      });
      return form;
    }

    function render() {
      for (const [status, lane] of lanes) {
        const items = tasks.filter(task => task.status === status);
        const nodes = items.map(task => editor?.id === task.id ? makeEditor() : makeCard(task));
        const startsHere = editor?.status === status && !editor.id;
        if (startsHere) nodes.push(makeEditor());
        lane.cards.replaceChildren(...nodes);
        lane.count.textContent = items.length;
        lane.add.hidden = startsHere;
      }
    }

    function closeActions(except = null) {
      for (const actions of board.querySelectorAll(".card-actions[open]")) {
        if (actions !== except) actions.open = false;
      }
    }

    for (const status of statuses) {
      const lane = element("section", "lane");
      lane.dataset.status = status.id;
      const header = element("div", "lane-head");
      const dot = element("span", "lane-dot");
      dot.setAttribute("aria-hidden", "true");
      const heading = element("h2", "", status.title);
      heading.id = `heading-${status.id}`;
      lane.setAttribute("aria-labelledby", heading.id);
      const count = element("span", "count", "0");
      count.setAttribute("aria-hidden", "true");
      header.append(dot, heading, count);
      const cards = element("div", "cards");
      const add = element("button", "add-card");
      add.setAttribute("aria-label", `Добавить задачу в колонку «${status.title}»`);
      const plus = element("span", "plus");
      plus.setAttribute("aria-hidden", "true");
      add.append(plus, "Добавить задачу");
      add.addEventListener("click", () => openEditor(status.id));
      lane.append(header, cards, add);
      board.append(lane);
      lanes.set(status.id, { ...status, cards, count, add });
    }

    function clearDropMark() {
      if (!drag) return;
      drag.lane?.classList.remove("is-over");
      drag.target?.classList.remove("is-before", "is-after");
      drag.lane = null;
      drag.target = null;
    }

    function endDrag() {
      clearDropMark();
      drag.source.classList.remove("is-dragging");
      drag.preview?.remove();
      drag = null;
    }

    board.addEventListener("pointerdown", event => {
      const grip = event.target.closest(".card-grip");
      if (!grip || editor || drag || event.button !== 0) return;
      event.preventDefault();
      closeActions();
      grip.setPointerCapture(event.pointerId);
      drag = {
        pointerId: event.pointerId,
        source: grip.closest(".card"),
        startX: event.clientX,
        startY: event.clientY,
        preview: null,
        lane: null,
        target: null,
        after: false
      };
    });

    function trackDrag(event) {
      if (!drag.preview) {
        if (Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 5) return;
        const title = drag.source.querySelector(".card-title").textContent;
        drag.preview = element("div", "card drag-preview", title);
        drag.preview.setAttribute("aria-hidden", "true");
        drag.preview.style.width = `${drag.source.offsetWidth}px`;
        document.body.append(drag.preview);
        drag.source.classList.add("is-dragging");
      }
      drag.preview.style.left = `${event.clientX + 12}px`;
      drag.preview.style.top = `${event.clientY + 10}px`;
      clearDropMark();
      const lane = document.elementFromPoint(event.clientX, event.clientY)?.closest(".lane");
      if (!lane) return;
      const cards = [...lane.querySelectorAll(".card")];
      let target = cards.find(card => {
        const box = card.getBoundingClientRect();
        return event.clientY < box.top + box.height / 2;
      });
      const after = !target;
      if (!target) target = cards.at(-1);
      drag.lane = lane;
      drag.target = target;
      drag.after = after;
      lane.classList.add("is-over");
      if (target !== drag.source) target?.classList.add(after ? "is-after" : "is-before");
    }

    board.addEventListener("pointermove", event => {
      if (drag?.pointerId === event.pointerId) trackDrag(event);
    });

    board.addEventListener("pointerup", event => {
      if (drag?.pointerId !== event.pointerId) return;
      trackDrag(event);
      const { source, lane, target, after } = drag;
      endDrag();
      if (lane) moveTask(source.dataset.task, lane.dataset.status, target?.dataset.task, after);
    });
    board.addEventListener("lostpointercapture", event => {
      if (drag?.pointerId === event.pointerId) endDrag();
    });

    document.addEventListener("click", event => {
      if (!event.target.closest(".card-actions")) closeActions();
    });
    document.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      if (drag) endDrag();
      const open = board.querySelector(".card-actions[open]");
      if (open) {
        closeActions();
        open.querySelector("summary").focus();
      }
    });

    window.addEventListener("storage", event => {
      const currentTaskKey = taskKey(activeBoardId);
      if (event.key === boardsKey || event.key === null) {
        try {
          boards = parseBoards(readStorage(boardsKey));
          if (!boards.some(item => item.id === activeBoardId)) {
            selectBoard(firstBoard.id);
            return;
          }
          renderBoardList();
        } catch {
          storageError.hidden = false;
        }
      }
      if ((event.key !== currentTaskKey && event.key !== null) || unsaved.has(currentTaskKey)) return;
      try {
        tasks = parseTasks(readStorage(currentTaskKey));
        if (drag) endDrag();
        reconcileDraft();
        const focused = document.activeElement;
        const field = focused?.closest(".editor") ? focused.tagName.toLowerCase() : "";
        render();
        if (field) board.querySelector(`.editor ${field}`)?.focus();
      } catch {
        storageError.hidden = false;
      }
    });

    document.querySelector("#new-task").addEventListener("click", () => openEditor("todo"));
    document.querySelector("#new-board").addEventListener("click", () => {
      const id = createId();
      updateBoards(list => {
        const names = new Set(list.map(item => item.title));
        const base = "Новая доска";
        let title = base;
        for (let suffix = 2; names.has(title); suffix += 1) title = `${base} ${suffix}`;
        return [...list, { id, title }];
      });
      selectBoard(id);
      boardList.querySelector("[aria-current]")?.scrollIntoView({ block: "nearest", inline: "nearest" });
      showRenameForm();
    });
    renameButton.addEventListener("click", showRenameForm);
    document.querySelector("#cancel-rename").addEventListener("click", () => {
      hideRenameForm();
      renameButton.focus();
    });
    renameInput.addEventListener("input", () => renameInput.setCustomValidity(""));
    renameForm.addEventListener("keydown", event => {
      if (event.key !== "Escape") return;
      event.preventDefault();
      hideRenameForm();
      renameButton.focus();
    });
    renameForm.addEventListener("submit", event => {
      event.preventDefault();
      const title = renameInput.value.trim();
      if (!title) {
        renameInput.setCustomValidity("Введи название доски.");
        renameInput.reportValidity();
        return;
      }
      updateBoards(list => list.map(item => item.id === activeBoardId ? { ...item, title } : item));
      hideRenameForm();
      renderBoardList();
      renameButton.focus();
      announcement.textContent = "Название доски сохранено.";
    });
    try {
      boards = parseBoards(readStorage(boardsKey));
      const lastBoardId = readStorage(selectionKey);
      if (boards.some(item => item.id === lastBoardId)) activeBoardId = lastBoardId;
    } catch {
      storageError.hidden = false;
    }
    loadTasks();
    renderBoardList();
    render();
  </script>
</body>
</html>
